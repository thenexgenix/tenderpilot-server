services:
  postgres:
    image: postgres:16
    container_name: tenderpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tenderpilot}
    ports:
      - "5432:5432"
    volumes:
      - tenderpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tenderpilot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tenderpilot}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting the app}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AI_PROVIDER_CHAIN: ${AI_PROVIDER_CHAIN:-gemini}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage

volumes:
  tenderpilot-postgres-data:
